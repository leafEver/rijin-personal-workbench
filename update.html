<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>正在更新日进工作台</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #334036;
        background: #f4f1e9;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
        box-sizing: border-box;
      }

      main {
        width: min(420px, 100%);
        padding: 30px 24px;
        border: 1px solid rgba(57, 72, 58, 0.16);
        border-radius: 24px;
        background: rgba(255, 254, 250, 0.94);
        box-shadow: 0 24px 80px rgba(52, 65, 52, 0.12);
        text-align: center;
      }

      strong {
        display: block;
        font-family: "Songti SC", "STSong", serif;
        font-size: 24px;
        font-weight: 600;
      }

      p {
        margin: 12px 0 0;
        color: #7c847b;
        font-size: 13px;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 11px 18px;
        border-radius: 999px;
        color: #fff;
        background: #61715f;
        text-decoration: none;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>正在加载新版课表</strong>
      <p id="update-status">正在清理旧缓存，请稍候……</p>
      <a href="./?v=22">如果没有自动进入，请点这里</a>
    </main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          document.querySelector("#update-status").textContent = "清理完成，正在进入新版工作台……";
        } catch {
          document.querySelector("#update-status").textContent = "即将进入新版工作台……";
        }
        window.setTimeout(() => window.location.replace("./?v=22"), 700);
      })();
    </script>
  </body>
</html>
